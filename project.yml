name: FatimasSchrank
options:
  bundleIdPrefix: de.kmrn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  FatimasSchrank:
    type: application
    platform: iOS
    sources:
      - FatimasSchrank
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kmrn.fatimasschrank
        PRODUCT_NAME: FatimasSchrank
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Schrank
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSCameraUsageDescription: Damit du deine Kleidung direkt fotografieren kannst.
        NSLocationWhenInUseUsageDescription: Damit dein Kalender das Wetter dort zeigt, wo du gerade bist.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
schemes:
  FatimasSchrank:
    build:
      targets:
        FatimasSchrank: all
